name: Render Instagram Video

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: Content ID
        required: false
        default: skilledtechie_001
      hook:
        description: Hook text
        required: false
        default: Stop reading long PDFs the hard way.
      tool_name:
        description: AI tool name
        required: false
        default: NotebookLM
      voiceover:
        description: Voiceover script
        required: false
        default: Still reading long PDFs the hard way? Meet NotebookLM. Upload your documents, ask questions, and get answers grounded in your sources. It is like turning your files into an AI research assistant. Follow @skilledtechie for more AI tools.
  schedule:
    - cron: '30 12 * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Python rendering dependencies
        run: python -m pip install --upgrade pip pillow edge-tts
      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libass9 fonts-dejavu espeak-ng
      - name: Preflight checks
        run: |
          python -c "import PIL; print('Pillow OK', PIL.__version__)"
          command -v ffmpeg
          command -v ffprobe
          command -v edge-tts
          command -v espeak-ng
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          ffmpeg -hide_banner -filters | grep -q 'zoompan'
          ffmpeg -hide_banner -filters | grep -q 'subtitles'
          python -m py_compile scripts/render_reel.py
      - name: Render animated reel with voiceover
        env:
          CONTENT_ID: ${{ inputs.content_id || 'skilledtechie_001' }}
          HOOK: ${{ inputs.hook || 'Stop reading long PDFs the hard way.' }}
          TOOL_NAME: ${{ inputs.tool_name || 'NotebookLM' }}
          VOICEOVER: ${{ inputs.voiceover || 'Still reading long PDFs the hard way? Meet NotebookLM. Upload your documents, ask questions, and get answers grounded in your sources. It is like turning your files into an AI research assistant. Follow @skilledtechie for more AI tools.' }}
        run: python3 scripts/render_reel.py
      - name: Upload reel and QA
        uses: actions/upload-artifact@v4
        with:
          name: skilledtechie-animated-reel
          path: |
            output/reel.mp4
            output/voice.mp3
            output/voice.wav
            output/voice.srt
            output/qa.txt
            output/scenes/*.jpg
          retention-days: 7
          if-no-files-found: error
