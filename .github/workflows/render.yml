name: Render Instagram Video

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Airtable Content ID'
        required: true
        type: string
      hook:
        description: 'Reel hook'
        required: true
        type: string
      tool_name:
        description: 'Tool name'
        required: true
        type: string
  schedule:
    - cron: '30 12 * * *'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render dynamic Reel
        env:
          CONTENT_ID: ${{ inputs.content_id || 'scheduled-test' }}
          HOOK: ${{ inputs.hook || 'THIS AI TOOL IS WILD' }}
          TOOL_NAME: ${{ inputs.tool_name || 'AI TOOL' }}
        run: python3 scripts/render_reel.py

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: reel-${{ inputs.content_id || 'scheduled-test' }}
          path: output/reel.mp4
          retention-days: 7
